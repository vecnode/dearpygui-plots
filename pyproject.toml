[project]
name = "dearpygui-plots"
version = "0.1.0"
description = "DearPyGui plot examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dearpygui",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]
